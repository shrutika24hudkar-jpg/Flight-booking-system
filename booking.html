<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FlyEase | Book Flight</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<nav class="navbar">

    <div class="nav-logo">
        ✈ <span>FlyEase</span>
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Flights
        </a>

        <a onclick="showBookings()">
            My Bookings
        </a>

        <button
            class="logout-btn"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </div>

</nav>


<main class="booking-page">

    <div class="booking-heading">

        <button
            class="back-btn"
            onclick="history.back()"
        >
            ←
        </button>

        <div>

            <h1>Complete your booking</h1>

            <p>
                Enter passenger details to reserve your flight.
            </p>

        </div>

    </div>


    <div class="booking-layout">


        <!-- PASSENGER FORM -->

        <section class="passenger-card">

            <div class="card-title">

                <div class="title-icon">
                    👤
                </div>

                <div>
                    <h2>Passenger Details</h2>

                    <p>
                        Please enter details exactly as they appear on your ID.
                    </p>
                </div>

            </div>


            <form id="bookingForm" onsubmit="confirmBooking(event)">

                <div class="form-grid">

                    <div>

                        <label>First Name</label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required
                        >

                    </div>


                    <div>

                        <label>Last Name</label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required
                        >

                    </div>


                    <div>

                        <label>Email</label>

                        <input
                            type="email"
                            id="passengerEmail"
                            placeholder="Email address"
                            required
                        >

                    </div>


                    <div>

                        <label>Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="10-digit mobile number"
                            pattern="[0-9]{10}"
                            required
                        >

                    </div>


                    <div>

                        <label>Gender</label>

                        <select id="gender" required>

                            <option value="">
                                Select gender
                            </option>

                            <option>
                                Male
                            </option>

                            <option>
                                Female
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>


                    <div>

                        <label>Age</label>

                        <input
                            type="number"
                            id="age"
                            min="1"
                            max="100"
                            placeholder="Age"
                            required
                        >

                    </div>

                </div>


                <div class="checkbox-row">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I confirm that the passenger information provided is correct.
                    </label>

                </div>


                <button
                    type="submit"
                    class="confirm-btn"
                >
                    Confirm Booking →
                </button>

            </form>

        </section>


        <!-- FLIGHT SUMMARY -->

        <aside class="booking-summary">

            <h2>Flight Summary</h2>

            <div id="bookingFlight">

                <!-- JS -->

            </div>

        </aside>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
