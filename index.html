<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyEase | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">
        <div class="logo">✈</div>
        <h1>Fly<span>Ease</span></h1>
        <p>Book flights. Travel easy.</p>
    </div>

    <div class="auth-card">

        <div class="auth-tabs">
            <button class="active" onclick="showLogin()">Login</button>
            <button onclick="showRegister()">Register</button>
        </div>

        <!-- LOGIN -->
        <form id="loginForm" onsubmit="loginUser(event)">

            <h2>Welcome back 👋</h2>
            <p class="form-subtitle">Login to continue your journey</p>

            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button class="primary-btn" type="submit">
                Login
            </button>

            <p class="switch-text">
                Don't have an account?
                <span onclick="showRegister()">Create one</span>
            </p>

        </form>

        <!-- REGISTER -->
        <form id="registerForm" class="hidden" onsubmit="registerUser(event)">

            <h2>Create account ✨</h2>
            <p class="form-subtitle">Start planning your next trip</p>

            <label>Full Name</label>
            <input type="text" id="registerName" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="registerEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="Create a password" required>

            <button class="primary-btn" type="submit">
                Create Account
            </button>

            <p class="switch-text">
                Already have an account?
                <span onclick="showLogin()">Login</span>
            </p>

        </form>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
